<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daby: Inglês LEGO - Dominando Frases Corporativas</title>
    <!-- 1. Tailwind CSS CDN for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 2. React CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- 3. Babel CDN to compile JSX in the browser (essential for single-file React deployment) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        /* Optional: Set a default font and smooth scrolling */
        body {
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }
        /* Custom styles for the app layout */
        #root {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        /* Custom list style for the verb lesson */
        .verb-list {
            list-style: none;
            padding: 0;
        }
        .verb-list li {
            position: relative;
            padding-left: 1.5em;
            margin-bottom: 0.5em;
        }
        .verb-list li::before {
            content: '✅';
            position: absolute;
            left: 0;
        }
    </style>
</head>
<body>
    <div id="root">
        <!-- React App mounts here -->
    </div>

    <!-- The React code must be placed inside a script tag with type="text/babel" -->
    <script type="text/babel">
        const { useState } = React;

        // Data structure holding the lessons - NEW CORPORATE PHRASES
        const lessons = [
            // 1. I am in a meeting.
            {
              id: 1,
              bp: "Eu estou em uma reunião.",
              title: "Preposições de Local de Trabalho",
              variations: {
                essential: "I am in a meeting right now.",
                polite: "I am presently engaged in a meeting.",
                native: "I'm tied up in a meeting.",
              },
              steps: [
                { bp: "Eu estou", literal: "I am", correct: "I am", catch: "Simples: **'I am'** (Eu sou/estou). Use a contração **'I'm'** para parecer mais natural." },
                { bp: "em uma reunião", literal: "in one meeting", correct: "in a meeting.", catch: "Use a preposição **'in'** para reuniões físicas ou eventos. Você usa **'on'** para chamadas (e.g., 'on a call')." },
              ]
            },
            // 2. I am in the middle of something (serious).
            {
              id: 2,
              bp: "Eu estou no meio de algo (sério).",
              title: "Expressão Idiomática de Ocupação",
              variations: {
                essential: "I'm in the middle of something important.",
                polite: "I am currently focused on a time-sensitive matter.",
                native: "Can't talk right now, I'm knee-deep in work.",
              },
              steps: [
                { bp: "Eu estou no meio", literal: "I am in the middle", correct: "I'm in the middle", catch: "A expressão **'in the middle of something'** significa estar ocupado e indisponível. 'In' é a preposição correta." },
                { bp: "de algo importante.", literal: "of something serious.", correct: "of something important.", catch: "Use **'important'** ou **'time-sensitive'** para indicar seriedade no ambiente de trabalho. É mais profissional do que 'serious'." },
              ]
            },
            // 3. I report to Daniel.
            {
              id: 3,
              bp: "Eu me reporto ao Daniel.",
              title: "Hierarquia e Subordinação",
              variations: {
                essential: "I report to Daniel.",
                polite: "Daniel is my direct supervisor.",
                native: "I'm on Daniel's team, he's my boss.",
              },
              steps: [
                { bp: "Eu me reporto", literal: "I report me", correct: "I report", catch: "Em inglês, o verbo **'to report'** já implica a subordinação e não precisa de um pronome reflexivo ('me')." },
                { bp: "ao Daniel.", literal: "to the Daniel.", correct: "to Daniel.", catch: "A preposição correta para indicar seu superior é **'to'**. Não use 'the' antes de nomes próprios." },
              ]
            },
            // 4. I have been working here since 2020.
            {
              id: 4,
              bp: "Eu trabalho aqui desde 2020.",
              title: "Present Perfect Continuous (Ação Contínua)",
              variations: {
                essential: "I have been working here since 2020.",
                polite: "I have held this employment since 2020.",
                native: "Been with the company since 2020.",
              },
              steps: [
                { bp: "Eu trabalho aqui", literal: "I work here", correct: "I have been working here", catch: "Ação que **começou no passado e continua até hoje** usa **Present Perfect Continuous** ('have been working'). 'I work here' implica um fato geral no presente." },
                { bp: "desde 2020.", literal: "since 2020.", correct: "since 2020.", catch: "Use **'since'** para indicar um **ponto de partida** (o ano 2020). Use 'for' para indicar a duração (e.g., 'for four years')." },
              ]
            },
            // 5. I have been in this position since 2022.
            {
              id: 5,
              bp: "Eu estou nesta posição desde 2022.",
              title: "Present Perfect Simple (Estado/Duração)",
              variations: {
                essential: "I have been in this position since 2022.",
                polite: "My tenure in this role began in 2022.",
                native: "Been doing this job since '22.",
              },
              steps: [
                { bp: "Eu estou nesta posição", literal: "I am in this position", correct: "I have been in this position", catch: "Para **estados** ou **posições** (com o verbo 'to be') que duram até o presente, usamos o **Present Perfect Simple** ('have been'). O PPC ('have been being') não é usado para 'to be'." },
                { bp: "desde 2022.", literal: "since 2022.", correct: "since 2022.", catch: "A preposição **'in'** é a correta para 'posição' ou 'cargo'. Mais uma vez, use **'since'** para o ponto inicial." },
              ]
            },
            // 6. I work in a large company.
            {
              id: 6,
              bp: "Eu trabalho em uma grande empresa.",
              title: "Estrutura de Frase e Preposições",
              variations: {
                essential: "I work for a large company.",
                polite: "I am employed by a major corporation.",
                native: "I work for a big firm.",
              },
              steps: [
                { bp: "Eu trabalho", literal: "I work", correct: "I work", catch: "Correto! Aqui é um fato atual, use o Present Simple." },
                { bp: "em uma grande empresa.", literal: "in a large company.", correct: "for a large company.", catch: "THE CATCH: Quando você trabalha **para** (a serviço de) uma organização, use a preposição **'for'** (I work for). Você trabalha **'in'** um departamento (e.g., 'I work in Marketing')." },
              ]
            },
            // 7. Overall, I have got 15 years of experience in sales.
            {
              id: 7,
              bp: "No geral, eu tenho 15 anos de experiência em vendas.",
              title: "Experiência Acumulada (Present Perfect)",
              variations: {
                essential: "Overall, I have 15 years of experience in sales.",
                polite: "My cumulative experience in the field of sales spans 15 years.",
                native: "I've got 15 years in sales, total.",
              },
              steps: [
                { bp: "No geral, eu tenho", literal: "Overall, I have got", correct: "Overall, I have", catch: "Você pode usar **'I have'** ou **'I've got'**. 'Overall' (no geral) é um ótimo termo para começar resumos de carreira. Não use 'Overall, I am having'." },
                { bp: "15 anos de experiência em vendas.", literal: "15 years of experience in sales.", correct: "15 years of experience in sales.", catch: "Use a preposição **'in'** para a área de atuação (e.g., 'in finance', 'in HR')." },
              ]
            },
            // 8. I have worked on many projects.
            {
              id: 8,
              bp: "Eu trabalhei em muitos projetos.",
              title: "Ênfase na Experiência (Present Perfect Simple)",
              variations: {
                essential: "I have worked on many projects.",
                polite: "I have contributed to numerous projects.",
                native: "I've handled a bunch of projects.",
              },
              steps: [
                { bp: "Eu trabalhei", literal: "I worked", correct: "I have worked", catch: "Use **Present Perfect Simple** ('have worked') quando a experiência acumulada é relevante para o presente, sem especificar um tempo *terminado* (como 'yesterday')." },
                { bp: "em muitos projetos.", literal: "in many projects.", correct: "on many projects.", catch: "THE CATCH: A preposição correta para projetos, tarefas e relatórios é **'on'** (e.g., 'work on a project', 'work on a report')." },
              ]
            },
            // 9. I have been working on many high-level projects. (Updated)
            {
              id: 9,
              bp: "Eu tenho trabalhado em muitos projetos estratégicos.",
              title: "Ação em Andamento (Present Perfect Continuous) e Senioridade",
              variations: {
                essential: "I have been working on many high-level projects.",
                polite: "My current workload involves several key and strategic projects.",
                native: "I've been juggling a lot of major, high-stakes projects.",
              },
              steps: [
                { bp: "Eu tenho trabalhado", literal: "I have worked", correct: "I have been working", catch: "Usa-se o **Present Perfect Continuous** ('have been working') para enfatizar que a atividade é **contínua** e que você está ativamente envolvido **agora**." },
                { bp: "em muitos projetos.", literal: "in many projects.", correct: "on many high-level projects.", catch: "O termo **'high-level'** (alto nível/estratégico) é mais profissional do que 'important'. Mantenha a preposição **'on'** para projetos." },
              ]
            },
            // 10. I work in-person and attend many in-person meetings.
            {
              id: 10,
              bp: "Eu trabalho presencialmente e participo de muitas reuniões presenciais.",
              title: "Adjetivos e Advérbios de Trabalho",
              variations: {
                essential: "I work in-person and attend many in-person meetings.",
                polite: "I work physically on-site and participate in numerous face-to-face meetings.",
                native: "I'm mostly on-site, lot of face-time meetings.",
              },
              steps: [
                { bp: "Eu trabalho presencialmente", literal: "I work presentially", correct: "I work in-person", catch: "O advérbio correto é **'in-person'** (com hífen se for um adjetivo antes de um substantivo, 'in-person meeting'). Não existe 'presentially'." },
                { bp: "e participo de reuniões.", literal: "and participate of meetings.", correct: "and attend meetings.", catch: "O verbo **'to attend'** (participar/assistir) é transitivo direto e não precisa da preposição 'of' em inglês (e.g., 'attend the meeting', não 'attend of the meeting')." },
              ]
            },
            // 11. I work on a team.
            {
              id: 11,
              bp: "Eu trabalho em uma equipe.",
              title: "Preposição com 'Team'",
              variations: {
                essential: "I work on a team.",
                polite: "I am a collaborative member of a team.",
                native: "I'm part of the team.",
              },
              steps: [
                { bp: "Eu trabalho", literal: "I work", correct: "I work", catch: "Correto. Present Simple para um fato permanente/atual." },
                { bp: "em uma equipe.", literal: "in a team.", correct: "on a team.", catch: "THE CATCH: Use a preposição **'on'** com 'team' (e.g., 'I am on the design team', 'I work on a team')." },
              ]
            },
            // 12. I have joined (the name of your company you work or worked) in 2020.
            {
              id: 12,
              bp: "Eu entrei ou comecei na [Empresa] em 2020.",
              title: "Simple Past (Tempo Específico Terminado)",
              variations: {
                essential: "I joined TechCorp in 2020.",
                polite: "I commenced my employment at TechCorp in 2020.",
                native: "Started with TechCorp back in '20.",
              },
              steps: [
                { bp: "Eu entrei na [Empresa]", literal: "I started TechCorp", correct: "I joined TechCorp", catch: "REGRA MESTRE: O marcador de tempo **'in 2020'** (tempo específico) força o **Simple Past** ('I joined'). Nunca use Present Perfect ('have joined') com tempo terminado. Além disso, use 'joined' ou 'started AT' — 'I started TechCorp' (sem 'at') é menos idiomático." },
                { bp: "em 2020.", literal: "in 2020.", correct: "in 2020.", catch: "Use a preposição **'in'** antes de anos. O verbo 'join' não precisa de preposição como 'in' ou 'at' antes do nome da empresa, mas 'start' pede 'at' ('I started at TechCorp')." },
              ]
            },
            // 13. Can you hear me? loud and clear.
            {
              id: 13,
              bp: "Você pode me ouvir? Sim estou ouvindo.",
              title: "Frases Comuns de Chamada (Calls)",
              variations: {
                essential: "Can you hear me? Yes, I can hear you clearly.",
                polite: "Am I audible on your end? You are perfectly audible.",
                native: "Am I coming through? Yep, loud and clear.",
              },
              steps: [
                { bp: "Você pode me ouvir?", literal: "Do you hear me? / Do you listen me? / Could you hear or listen me?", correct: "Can you hear me?", catch: "THE CATCH: Para confirmar se o áudio está funcionando (capacidade), use o modal **'Can'**. NUNCA use 'listen' (que implica atenção, não audição) e evite 'do you hear me?' em favor de 'Can you hear me?' ou 'Am I audible?'." },
                { bp: "Sim estou ouvindo.", literal: "Yes, I am listening.", correct: "Yes, I can hear you clearly.", catch: "A resposta correta é **'I can hear you'** (eu consigo te ouvir). 'I am listening' (eu estou prestando atenção) é gramaticalmente correto, mas não é a resposta idiomática para testar o áudio." },
              ]
            },
            // 14. My internet is lagging.
            {
              id: 14,
              bp: "Minha internet está travando/lenta.",
              title: "Vocabulário de Problemas de Conexão",
              variations: {
                essential: "My connection is lagging.",
                polite: "I am experiencing connectivity delays (lag).",
                native: "Sorry, my signal's really choppy.",
              },
              steps: [
                { bp: "Minha internet está", literal: "My internet is", correct: "My connection is", catch: "Usar **'My connection'** (minha conexão) é mais profissional e técnico para falhas de rede do que apenas 'My internet'. Use no Present Continuous." },
                { bp: "travando/lenta.", literal: "slow.", correct: "lagging.", catch: "Embora 'slow' (lenta) seja correto, **'lagging'** é o termo técnico mais usado para descrever o atraso e a interrupção da conexão em tempo real." },
              ]
            },
            // 15. I am afraid. (explain in lego block method... step by step building these sentences and the choice... same format as you did on the website... you may add
            {
              id: 15,
              bp: "Eu sinto muito (em introduzir uma má notícia).",
              title: "Abertura para Notícias Negativas ('I'm afraid')",
              variations: {
                essential: "I'm afraid I won't be able to finish on time.",
                polite: "I regret to inform you that the deadline may be missed.",
                native: "Bad news, I can't meet the deadline.",
              },
              steps: [
                { bp: "Eu sinto muito", literal: "I am sorry", correct: "I'm afraid", catch: "THE CATCH: **'I'm sorry'** significa lamentar algo que você fez ('I'm sorry I was late'). Para introduzir uma notícia negativa ou discordar de forma educada, use **'I'm afraid'** ('Receio que...')." },
                { bp: "não poderei terminar.", literal: "I will not finish.", correct: "I won't be able to finish on time.", catch: "Use 'won't be able to' (não serei capaz de) para soar mais profissional. A palavra 'afraid' suaviza a negação." },
              ]
            },
        ];


        // VariationButton component
        const VariationButton = ({ label, selected, onClick, isDarkMode }) => (
          <button
            onClick={onClick}
            className={`px-4 py-2 text-sm font-semibold rounded-full transition-all duration-200 ${
              selected
                ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-500/50'
                : isDarkMode
                  ? 'bg-indigo-800/50 text-indigo-300 hover:bg-indigo-700/70'
                  : 'bg-indigo-100 text-indigo-700 hover:bg-indigo-200'
            }`}
          >
            {label}
          </button>
        );

        // Main App component
        const App = () => {
          // Start on the first lesson by default, as it's the core contrast
          const [selectedLessonId, setSelectedLessonId] = useState(lessons[0].id);
          const [selectedVariation, setSelectedVariation] = useState('essential');
          // Start in dark mode by default
          const [darkMode, setDarkMode] = useState(true); 
          const selectedLesson = lessons.find(l => l.id === selectedLessonId);

          const toggleDarkMode = () => setDarkMode(prev => !prev);

          // Define base colors based on mode
          const bgColor = darkMode ? 'bg-slate-900' : 'bg-gray-50';
          const cardColor = darkMode ? 'bg-slate-800' : 'bg-white';
          const primaryTextColor = darkMode ? 'text-gray-100' : 'text-gray-900';
          const secondaryTextColor = darkMode ? 'text-green-400' : 'text-green-600'; /* Changed color emphasis to green */
          const cardShadow = darkMode ? 'shadow-2xl shadow-slate-700/50' : 'shadow-xl';
          const borderColor = darkMode ? 'border-slate-700' : 'border-indigo-100';

          if (!selectedLesson) {
            return <div className="p-8 text-center text-red-500">Lição não encontrada.</div>;
          }

          // Function to render content safely, including HTML for the verb list
          const renderContent = (content) => {
              if (typeof content === 'string' && content.includes('<ul class="verb-list')) {
                  return <div dangerouslySetInnerHTML={{ __html: content }} />;
              }
              return <p className="font-bold text-green-700 text-lg">{content}</p>;
          };


          return (
            <div className={`min-h-screen font-sans p-4 sm:p-8 ${bgColor} ${primaryTextColor} w-full`}>
              <header className="mb-8 text-center relative">
                {/* Dark Mode Toggle Button */}
                <button
                    onClick={toggleDarkMode}
                    className={`absolute top-0 right-0 p-2 rounded-full transition-colors duration-300 ${
                        darkMode ? 'bg-indigo-600 text-white hover:bg-indigo-500' : 'bg-indigo-100 text-indigo-700 hover:bg-indigo-200'
                    }`}
                    aria-label="Toggle Dark Mode"
                >
                    {darkMode ? 
                        <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" viewBox="0 0 20 20" fill="currentColor"><path d="M17.293 13.513A10 10 0 0110 20V0c5.523 0 10 4.477 10 10 0 1.574-.36 3.064-1.026 4.398l-1.681-1.681zM10 18a8 8 0 100-16 8 8 0 000 16z" clipRule="evenodd" /></svg>
                        :
                        <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.969 5.836a1 1 0 01-1.748 0L9.293 16a1 1 0 00-1.414 0l-.678.678a1 1 0 01-1.748 0 1 1 0 01-.168-.168l-3.232-3.232a1 1 0 011.414-1.414l3.232 3.232a1 1 0 001.414 0l.678-.678a1 1 0 011.748 0L14.707 16a1 1 0 01-1.414 1.414l-3.232-3.232a1 1 0 01-.168-.168z" clipRule="evenodd" /></svg>
                    }
                </button>

                {/* Novo Header para PARTE 1 */}
                <h2 className={`text-xl sm:text-2xl font-black text-indigo-400 mb-1 border-b-2 border-indigo-500 inline-block px-4 pb-1`}>
                    PARTE 1
                </h2>

                <h1 className={`text-3xl sm:text-4xl font-extrabold leading-tight ${primaryTextColor}`}>
                  🤖 Daby: Inglês corporativo method Bloco Lego para Brasileiros
                </h1>
                <p className={`mt-2 text-lg ${secondaryTextColor}`}>
                  Foco: **Comunicação Corporativa** e Estruturas Profissionais!
                  <br />
                  <span className={`text-base font-normal ${darkMode ? 'text-gray-400' : 'text-gray-600'}`}>
                    (Preposições, Hierarquia e Diferença de Tempos Verbais)
                  </span>
                </p>
                
              </header>

              {/* Selector and Main Content Grid */}
              <div className="flex flex-col lg:flex-row gap-8 max-w-7xl mx-auto">
                
                {/* Sidebar: Lesson Selector */}
                <div className={`lg:w-1/3 p-6 rounded-xl ${cardColor} ${cardShadow} h-fit border ${borderColor}`}>
                  <h2 className={`text-xl font-bold mb-4 ${secondaryTextColor}`}>Selecione uma Frase (BP)</h2>
                  <div className="space-y-2">
                    {lessons.map(lesson => (
                      <button
                        key={lesson.id}
                        onClick={() => {
                          setSelectedLessonId(lesson.id);
                          setSelectedVariation('essential');
                        }}
                        className={`w-full text-left p-3 rounded-lg transition-all duration-200 font-medium ${
                          lesson.id === selectedLessonId
                            ? 'bg-indigo-500 text-white shadow-md'
                            : darkMode
                              ? 'bg-slate-700 text-gray-300 hover:bg-slate-600'
                              : 'bg-gray-100 text-gray-700 hover:bg-indigo-50 hover:text-indigo-600'
                        }`}
                      >
                        {lesson.bp}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Main Lesson Content */}
                <div className="lg:w-2/3 space-y-8">

                  {/* Current Lesson Title */}
                  <div className={`p-6 rounded-xl ${cardColor} ${cardShadow} border-l-4 border-green-600`}>
                    <p className="text-xl font-light text-gray-500 mb-1">Frase Selecionada (Foco no Presente):</p>
                    <h2 className={`text-3xl font-extrabold ${primaryTextColor}`}>{selectedLesson.bp}</h2>
                    <p className={`mt-2 font-semibold ${secondaryTextColor}`}>{selectedLesson.title}</p>
                  </div>

                  {/* Lego Breakdown Section */}
                  <div className={`p-6 rounded-xl ${cardColor} ${cardShadow}`}>
                    <h3 className={`text-2xl font-bold mb-4 ${primaryTextColor} border-b pb-2`}>🧱 Método LEGO: Desmontando e Construindo</h3>
                    <div className="space-y-6">
                      {selectedLesson.steps.map((step, index) => (
                        <div key={index} className={`border p-4 rounded-lg ${darkMode ? 'border-slate-700 bg-slate-700/50' : 'border-gray-200 bg-green-50/50'}`}>
                          <p className="text-sm font-semibold text-gray-500 mb-2">Bloco {index + 1}</p>
                          
                          <div className="grid grid-cols-3 gap-3 mb-3">
                            {/* BP Block */}
                            <div className="text-center p-2 rounded-lg bg-pink-100 border border-pink-300">
                              <p className="font-bold text-pink-700 text-lg">{step.bp}</p>
                              <p className="text-xs text-pink-500">PORTUGUÊS (BR)</p>
                            </div>
                            
                            {/* Literal/Incorrect Block */}
                            <div className="text-center p-2 rounded-lg bg-red-100 border border-red-300">
                              <p className="font-bold text-red-700 text-lg">{step.literal}</p>
                              <p className="text-xs text-red-500">TRADUÇÃO LITERAL (INCORRETA)</p>
                            </div>
                            
                            {/* Correct Block */}
                            <div className="text-center p-2 rounded-lg bg-green-100 border border-green-300">
                              {renderContent(step.correct)}
                              <p className="text-xs text-green-500">BLOCO LEGO (CORRETO)</p>
                            </div>
                          </div>

                          <div className={`mt-3 p-3 rounded-lg border ${darkMode ? 'bg-slate-700 border-green-600' : 'bg-white border-green-300'}`}>
                            <p className="font-extrabold text-green-500">🚨 O CATCH / O ERRO ANTECIPADO:</p>
                            <p className={`text-sm ${darkMode ? 'text-gray-200' : 'text-gray-700'} mt-1`}>{step.catch}</p>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Variation Section */}
                  <div className={`p-6 rounded-xl ${cardColor} ${cardShadow}`}>
                    <h3 className={`text-2xl font-bold mb-4 ${primaryTextColor} border-b pb-2`}>🗣️ Versões para o Mundo Real</h3>
                    <div className="flex flex-wrap gap-3 mb-6">
                      <VariationButton 
                        label="BÁSICO/ESSENCIAL" 
                        selected={selectedVariation === 'essential'}
                        onClick={() => setSelectedVariation('essential')}
                        isDarkMode={darkMode}
                      />
                      <VariationButton 
                        label="EDUCADO (Polite)" 
                        selected={selectedVariation === 'polite'}
                        onClick={() => setSelectedVariation('polite')}
                        isDarkMode={darkMode}
                      />
                      <VariationButton 
                        label="NATIVO (Native/Casual)" 
                        selected={selectedVariation === 'native'}
                        onClick={() => setSelectedVariation('native')}
                        isDarkMode={darkMode}
                      />
                    </div>
                    
                    <div className={`p-4 sm:p-6 rounded-lg border-l-4 ${darkMode ? 'bg-slate-700 border-green-500' : 'bg-green-50 border-green-500'}`}>
                      <p className={`text-sm font-medium mb-1 ${secondaryTextColor}`}>
                        Versão Selecionada: <span className="uppercase">{selectedVariation}</span>
                      </p>
                      <p className={`text-2xl font-extrabold ${primaryTextColor} break-words`}>
                        {selectedLesson.variations[selectedVariation]}
                      </p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          );
        };
        
        // Render the App component using the React root API
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
